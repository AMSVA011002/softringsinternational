name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, mbstring
          coverage: none

      - name: Compile PHP pages into static HTML
        run: php build-pages.php _site

      - name: Verify static build
        run: |
          set -euo pipefail
          for page in index about services branches careers contact; do
            test -s "_site/${page}.html" || { echo "Missing ${page}.html"; exit 1; }
          done
          test -f "_site/.nojekyll" || { echo "Missing .nojekyll"; exit 1; }
          test -s "_site/404.html" || { echo "Missing 404.html"; exit 1; }
          test -f "_site/assets/css/style.css" || { echo "Missing stylesheet"; exit 1; }
          test -f "_site/assets/js/main.js" || { echo "Missing client script"; exit 1; }
          test -f "_site/assets/images/hero-corporate.jpg" || { echo "Missing hero image"; exit 1; }
          grep -q 'Softrings' _site/index.html || { echo "Corporate content missing"; exit 1; }
          if grep -q '<?php' _site/*.html; then echo "PHP code leaked into static build"; exit 1; fi
          ls -la _site
          echo "Static build verified."

      - name: Check whether GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages site detected."
          else
            echo "::error title=GitHub Pages is not enabled::A repository admin must enable Pages once at https://github.com/${GITHUB_REPOSITORY}/settings/pages (Build and deployment -> Source: GitHub Actions). Creating the Pages site needs admin rights, which the workflow token cannot hold. After enabling it, re-run this workflow."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
