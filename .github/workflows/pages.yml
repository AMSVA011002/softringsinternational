name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, mbstring
          coverage: none

      - name: Compile PHP pages into static HTML
        run: php build-pages.php _site

      - name: Verify static build
        run: |
          set -euo pipefail
          for page in index about services branches careers contact; do
            test -s "_site/${page}.html"
          done
          test -s "_site/.nojekyll"
          test -s "_site/404.html"
          test -d "_site/assets/css"
          test -d "_site/assets/js"
          test -d "_site/assets/images"
          grep -q 'Softrings' _site/index.html
          echo "Static build verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
